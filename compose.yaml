name: dfilterforge

x-runtime-hardening: &runtime-hardening
  cap_drop:
    - ALL
  init: true
  pids_limit: 128
  read_only: true
  restart: "no"
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m

services:
  lab:
    <<: *runtime-hardening
    profiles:
      - pilot
    build:
      context: .
      target: runtime
    image: dfilterforge-lab:0.1.0
    command:
      - doctor
      - --require-tshark-version
      - 4.6.8
    network_mode: none
    cpus: 1.0
    mem_limit: 512m
    volumes:
      - type: bind
        source: ./pcap_lab/fixtures
        target: /workspace/pcap_lab/fixtures
        read_only: true
      - type: bind
        source: ./artifacts
        target: /workspace/artifacts
      # Committed scoring output; writable because control scores are
      # produced in this container, while score --check only reads.
      - type: bind
        source: ./docs/results
        target: /workspace/results

  test:
    <<: *runtime-hardening
    profiles:
      - dev
    build:
      context: .
      target: test
    image: dfilterforge-test:0.1.0
    network_mode: none
    cpus: 2.0
    mem_limit: 2g
    # Test doubles are executable scripts; production /tmp remains noexec.
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=128m

  dev:
    <<: *runtime-hardening
    profiles:
      - dev
    build:
      context: .
      target: dev
    image: dfilterforge-dev:0.1.0
    command:
      - python
      - -m
      - dfilterforge
      - doctor
    network_mode: none
    cpus: 2.0
    mem_limit: 2g
    volumes:
      - type: bind
        source: ./src
        target: /workspace/src
        read_only: true
      - type: bind
        source: ./tests
        target: /workspace/tests
        read_only: true

  web:
    <<: *runtime-hardening
    profiles:
      - web-local
      - public-demo
    # SOURCE_COMMIT=$(git rev-parse HEAD) docker compose --profile web-local
    # up --build serves the site at http://127.0.0.1:3000/DFilterForge/.
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: site
      args:
        # Taken from the shell when set; the build refuses an unset commit,
        # and an unset base path keeps the Dockerfile default.
        - SOURCE_COMMIT
        - PAGES_BASE_PATH
    image: dfilterforge-web:0.1.0
    cpus: 1.0
    mem_limit: 512m
    ports:
      - "127.0.0.1:3000:3000"

  train:
    <<: *runtime-hardening
    profiles:
      - train
    # The CPU smoke by default; the parity test is
    # docker compose --profile train run --rm train python -m pytest -q
    # -p no:cacheprovider training/tests. The image holds the pinned
    # tokenizer and smoke model, so neither needs the network.
    build:
      context: .
      dockerfile: training/Dockerfile
      target: train
    image: dfilterforge-train:0.1.0
    command:
      - python
      - training/train_sft.py
      - --cpu-smoke
      - --output-dir
      - /workspace/artifacts/sft-smoke
    network_mode: none
    cpus: 4.0
    mem_limit: 6g
    # PyTorch and the tokenizer count threads against this limit.
    pids_limit: 256
    environment:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_CACHE: /tmp/hf-datasets
      OMP_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    volumes:
      - type: bind
        source: ./artifacts
        target: /workspace/artifacts
