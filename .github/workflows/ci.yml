name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality gates (pinned Docker runtime)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile dev build test
      - run: docker compose --profile dev run --rm test pyink --check src tests scripts
      - run: docker compose --profile dev run --rm test isort --check-only src tests scripts
      - run: docker compose --profile dev run --rm test pylint src scripts/model_run.py scripts/provider_reply_replay.py scripts/retrieval_recall.py scripts/probe_adequacy.py scripts/dev_bakeoff.py scripts/dev_bakeoff_configs.py scripts/two_turn_smoke.py
      - run: docker compose --profile dev run --rm test pyright
      - run: docker compose --profile dev run --rm test lint-imports --no-cache
      - run: docker compose --profile dev run --rm test
      - name: Check frozen prompt sets against the model-side code
        # The test image has no docs/ tree, so the suite above skips this
        # guard. With docs/ mounted, a branch that edits a prepare-hashed
        # file while a prompt set still awaits its call fails here rather
        # than at the call step's prepare_code_mismatch; the test -d keeps
        # a missing mount from passing as a skip. A prompt set with a
        # run_manifest.json beside it no longer counts as awaiting, so the
        # guard lapses once pass A publishes into
        # docs/results/test-qwen3-32b-2026-09-26. Pass B and the slot
        # winners' test passes call from that same prepare but publish
        # under their own run ids, so from then on an early merge passes
        # here; only the call's prepare_code_mismatch, which refuses each
        # later test call before any request, and the rule that the hashed
        # files stay unchanged until the last baseline test request remain.
        # Nothing else releases it: publish refuses an incomplete run and
        # writes only into the directory named after its run id. If pass A
        # publishes under another run id, or the A/A pair is reported not
        # run under rule 7 of the bake-off note, no manifest lands there and
        # this step fails every hashed-file edit, the merge after the last
        # baseline test request included, asking for a re-freeze the
        # protocol allows only before the first test request. The commit
        # that registers the hosted test runs, before that request, says
        # what releases the guard in that case.
        run: >-
          docker compose --profile dev run --rm
          --volume "$PWD/docs:/workspace/docs:ro"
          test sh -c 'test -d /workspace/docs/results
          && python -m pytest -q -rs -p no:cacheprovider
          tests/test_model_run.py::test_frozen_prompts_awaiting_a_call_match_the_model_side_code'
      - name: Re-count the committed A/A rerun with the pair report
        # The suite above skips this test for the same missing docs/ tree,
        # and it is the only check of the pair report against committed
        # passes rather than fixtures. It skips only when docs/results is
        # absent, which the test -d rules out, so here it runs or fails.
        run: >-
          docker compose --profile dev run --rm
          --volume "$PWD/docs:/workspace/docs:ro"
          test sh -c 'test -d /workspace/docs/results
          && python -m pytest -q -rs -p no:cacheprovider
          tests/test_pair_report.py::test_the_committed_c1_and_c2_rerun_is_the_one_the_v2_note_reports'
      - name: Refuse committed second turns no repair plan checks
        # score --check rebuilds only a prompt's first turn; the counted
        # answer and follow-up of a second turn are checked by repair
        # --check alone, for the arm runs named after a base pass with a
        # committed plan. This fails on any other committed run holding a
        # second turn, or a prompt set it cannot read. The suite skips it
        # for the missing docs/ tree, and the test -d rules that out here.
        run: >-
          docker compose --profile dev run --rm
          --volume "$PWD/docs:/workspace/docs:ro"
          test sh -c 'test -d /workspace/docs/results
          && python -m pytest -q -rs -p no:cacheprovider
          tests/test_repair.py::test_every_committed_second_turn_is_an_arm_a_plan_checks'
      - name: Verify semantic oracle and mutation witnesses
        run: >-
          docker compose --profile dev run --rm test
          python scripts/benchmark_gate.py --phase suite
          --output-dir /tmp/benchmark
          --source-revision "${{ github.sha }}"
      - name: Check model split labels and mutation adequacy
        run: >-
          docker compose --profile dev run --rm test
          python scripts/probe_adequacy.py
          --output /tmp/adequacy/receipt.json
          --source-revision "${{ github.sha }}"
      - name: Prepare dev prompts from the frozen catalog
        run: >-
          docker compose --profile dev run --rm test
          python scripts/model_run.py prepare
          --catalog /opt/dfilterforge/catalog.sqlite3
          --output-dir /tmp/model-eval/ci-prepare
          --source-revision "${{ github.sha }}"
      - name: Measure retrieval recall on the dev split
        run: >-
          docker compose --profile dev run --rm test
          python scripts/retrieval_recall.py
          --output /tmp/retrieval/recall.json
          --source-revision "${{ github.sha }}"
      - name: Re-score committed model runs offline
        run: |
          docker compose --profile pilot build lab
          checked=0
          for output in docs/results/*/scored \
              docs/results/*/control-reference \
              docs/results/*/control-mutation; do
            [ -d "$output" ] || continue
            run="$(basename "$(dirname "$output")")"
            name="$(basename "$output")"
            control=()
            if [ "$name" != scored ]; then
              control=(--control "${name#control-}")
            fi
            docker compose --profile pilot run --rm lab score \
              --run-dir "/workspace/results/$run" "${control[@]}" \
              --check --code-revision "${{ github.sha }}"
            checked=$((checked + 1))
          done
          echo "re-scored $checked committed output directories"
          test "$checked" -gt 0
      - name: Check committed repair plans and rounds offline
        # While no arm run sits beside its pass, each plan is derived again
        # from the pass and the feedback probe and compared byte for byte.
        # Once arm runs exist, the committed plan is the round's record: it
        # is read and checked against the pass, never derived again, so a
        # gold correction cannot break the check, and each arm's prompts
        # are checked against it. Once every arm run is published and
        # scored the round's summary is derived again too; an arm the gate
        # stopped is read from repair/not_run.json and reported as not run.
        # None is committed before the first repair round, so zero plans is
        # not a failure.
        run: |
          checked=0
          for plan in docs/results/*/repair/plan.json; do
            [ -f "$plan" ] || continue
            run="$(basename "$(dirname "$(dirname "$plan")")")"
            docker compose --profile pilot run --rm lab repair \
              --run-dir "/workspace/results/$run" \
              --check --code-revision "${{ github.sha }}"
            checked=$((checked + 1))
          done
          echo "checked $checked committed repair plans"
      - name: Check committed repair pools offline
        # Each pool is derived again from the committed summaries of the
        # bases it names; zero pools is not a failure.
        run: |
          checked=0
          for pooled in docs/results/repair-pool/*.json; do
            [ -f "$pooled" ] || continue
            docker compose --profile pilot run --rm lab repair-pool \
              --results-dir /workspace/results \
              --split "$(basename "$pooled" .json)" \
              --check --code-revision "${{ github.sha }}"
            checked=$((checked + 1))
          done
          echo "checked $checked committed repair pools"

  web:
    name: Web quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - run: corepack enable
      - run: corepack prepare pnpm@10.34.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:typecheck
      - run: pnpm web:lint
      - run: pnpm web:build
      - run: pnpm --filter @dfilterforge/web exec playwright install --with-deps chromium
      - run: pnpm --filter @dfilterforge/web test:e2e

  containers:
    name: Docker contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate all Compose profiles
        run: >-
          docker compose
          --profile pilot
          --profile dev
          --profile web-local
          --profile public-demo
          config
