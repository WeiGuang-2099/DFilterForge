name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality gates (pinned Docker runtime)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile dev build test
      - run: docker compose --profile dev run --rm test pyink --check src tests scripts
      - run: docker compose --profile dev run --rm test isort --check-only src tests scripts
      - run: docker compose --profile dev run --rm test pylint src scripts/model_run.py scripts/provider_reply_replay.py scripts/retrieval_recall.py scripts/probe_adequacy.py scripts/dev_bakeoff.py scripts/dev_bakeoff_configs.py
      - run: docker compose --profile dev run --rm test pyright
      - run: docker compose --profile dev run --rm test lint-imports --no-cache
      - run: docker compose --profile dev run --rm test
      - name: Check frozen prompt sets against the model-side code
        # The test image has no docs/ tree, so the suite above skips this
        # guard. With docs/ mounted, a branch that edits a prepare-hashed
        # file while a prompt set still awaits its call fails here rather
        # than at the call step's prepare_code_mismatch; the test -d keeps
        # a missing mount from passing as a skip. The hosted test-run
        # registry, docs/decisions/evidence/test-runs.json (owner ruling G,
        # 2026-10-01), decides for the frozen test prompts and every
        # registered run's directory: they stay guarded, a run_manifest.json
        # beside them or not, while any registered run may still send a
        # request, so pass A's publish releases nothing while pass B or a
        # slot winner is due. A run leaves only as published (its complete
        # run in docs/results/<run id>) or not_run with a reason, and this
        # step also fails on a status docs/results contradicts; once every
        # run is finished the guard releases without a re-freeze. Any other
        # prompt set is guarded until a run_manifest.json sits beside it.
        run: >-
          docker compose --profile dev run --rm
          --volume "$PWD/docs:/workspace/docs:ro"
          test sh -c 'test -d /workspace/docs/results
          && python -m pytest -q -rs -p no:cacheprovider
          tests/test_model_run.py::test_frozen_prompts_awaiting_a_call_match_the_model_side_code'
      - name: Verify semantic oracle and mutation witnesses
        run: >-
          docker compose --profile dev run --rm test
          python scripts/benchmark_gate.py --phase suite
          --output-dir /tmp/benchmark
          --source-revision "${{ github.sha }}"
      - name: Check model split labels and mutation adequacy
        run: >-
          docker compose --profile dev run --rm test
          python scripts/probe_adequacy.py
          --output /tmp/adequacy/receipt.json
          --source-revision "${{ github.sha }}"
      - name: Prepare dev prompts from the frozen catalog
        run: >-
          docker compose --profile dev run --rm test
          python scripts/model_run.py prepare
          --catalog /opt/dfilterforge/catalog.sqlite3
          --output-dir /tmp/model-eval/ci-prepare
          --source-revision "${{ github.sha }}"
      - name: Measure retrieval recall on the dev split
        run: >-
          docker compose --profile dev run --rm test
          python scripts/retrieval_recall.py
          --output /tmp/retrieval/recall.json
          --source-revision "${{ github.sha }}"
      - name: Re-score committed model runs offline
        run: |
          docker compose --profile pilot build lab
          checked=0
          for output in docs/results/*/scored \
              docs/results/*/control-reference \
              docs/results/*/control-mutation; do
            [ -d "$output" ] || continue
            run="$(basename "$(dirname "$output")")"
            name="$(basename "$output")"
            control=()
            if [ "$name" != scored ]; then
              control=(--control "${name#control-}")
            fi
            docker compose --profile pilot run --rm lab score \
              --run-dir "/workspace/results/$run" "${control[@]}" \
              --check --code-revision "${{ github.sha }}"
            checked=$((checked + 1))
          done
          echo "re-scored $checked committed output directories"
          test "$checked" -gt 0

  web:
    name: Web quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - run: corepack enable
      - run: corepack prepare pnpm@10.34.5 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:typecheck
      - run: pnpm web:lint
      - run: pnpm web:build
      - run: pnpm --filter @dfilterforge/web exec playwright install --with-deps chromium
      - run: pnpm --filter @dfilterforge/web test:e2e

  containers:
    name: Docker contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate all Compose profiles
        run: >-
          docker compose
          --profile pilot
          --profile dev
          --profile web-local
          --profile public-demo
          config
