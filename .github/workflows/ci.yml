name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality gates (pinned Docker runtime)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile dev build test
      - run: docker compose --profile dev run --rm test pyink --check src tests scripts
      - run: docker compose --profile dev run --rm test isort --check-only src tests scripts
      - run: docker compose --profile dev run --rm test pylint src scripts/model_run.py scripts/provider_reply_replay.py scripts/retrieval_recall.py scripts/probe_adequacy.py scripts/dev_bakeoff.py scripts/dev_bakeoff_configs.py scripts/test_passes.py scripts/two_turn_smoke.py scripts/repair_arms.py
      - run: docker compose --profile dev run --rm test pyright
      - run: docker compose --profile dev run --rm test lint-imports --no-cache
      - run: docker compose --profile dev run --rm test
      - name: Check frozen prompt sets and the test-run registration
        # The test image has no docs/ tree, so the suite above skips every
        # test that reads the committed docs/. This step runs them with
        # docs/ mounted; the test -d keeps a missing mount from passing as
        # a skip. They are the registration tests
        # (tests/test_hosted_test_runs.py: test-runs.json and the note list
        # the same rows, the caps meet the cap rule, the configs send the
        # ruled winners' routes), the bake-off ruling and smoke evidence
        # tests, the test-pass batch's committed-registry and note tests,
        # the repair-arm batch's tests of the committed passes, plans, caps
        # and note (it builds every dev arm with the real follow-up step),
        # the freeze quote test, and the frozen-prompt guard, so a
        # commit that lets the note and the registry drift fails here.
        # The guard fails a branch that edits a prepare-hashed file while a
        # prompt set still awaits its call, rather than at the call step's
        # prepare_code_mismatch. The hosted test-run registry,
        # docs/decisions/evidence/test-runs.json (owner ruling G,
        # 2026-10-01), decides for the frozen test prompts and every
        # registered run's directory: they stay guarded, a run_manifest.json
        # beside them or not, while any registered run may still send a
        # request, so pass A's publish releases nothing while pass B or a
        # slot winner is due. A run leaves only as published (its complete
        # run in docs/results/<run id>) or not_run with a reason, and this
        # step also fails on a status docs/results contradicts; once every
        # run is finished the guard releases without a re-freeze. Any other
        # prompt set is guarded until a run_manifest.json sits beside it.
        run: >-
          docker compose --profile dev run --rm
          --volume "$PWD/docs:/workspace/docs:ro"
          test sh -c 'test -d /workspace/docs/results
          && python -m pytest -q -rs -p no:cacheprovider
          tests/test_model_run.py::test_frozen_prompts_awaiting_a_call_match_the_model_side_code
          tests/test_hosted_test_runs.py tests/test_dev_bakeoff.py
          tests/test_test_passes.py tests/test_repair_arms.py
          tests/test_held_out.py'
      - name: Re-count the committed A/A reruns with the pair report
        # The suite above skips these tests for the same missing docs/
        # tree, and they are the only checks of the pair report against
        # committed passes rather than fixtures: the dev C1 and C2 rerun,
        # and the test A/A pair, whose report must equal the committed
        # evidence the locked test result reads. Each skips only when
        # docs/results is absent, which the test -d rules out, so here
        # they run or fail.
        run: >-
          docker compose --profile dev run --rm
          --volume "$PWD/docs:/workspace/docs:ro"
          test sh -c 'test -d /workspace/docs/results
          && python -m pytest -q -rs -p no:cacheprovider
          tests/test_pair_report.py::test_the_committed_c1_and_c2_rerun_is_the_one_the_v2_note_reports
          tests/test_pair_report.py::test_the_committed_test_a_a_pair_is_the_report_its_evidence_keeps'
      - name: Refuse committed second turns no repair plan checks
        # score --check rebuilds only a prompt's first turn; the counted
        # answer and follow-up of a second turn are checked by repair
        # --check alone, for the arm runs named after a base pass with a
        # committed plan. This fails on any other committed run holding a
        # second turn, or a prompt set it cannot read. The second node
        # re-serializes every committed prompt file byte for byte and holds
        # each to two messages, or four for a bare or counterexample arm
        # run of a committed plan. The suite skips both for the missing
        # docs/ tree, and the test -d rules that out here.
        run: >-
          docker compose --profile dev run --rm
          --volume "$PWD/docs:/workspace/docs:ro"
          test sh -c 'test -d /workspace/docs/results
          && python -m pytest -q -rs -p no:cacheprovider
          tests/test_repair.py::test_every_committed_second_turn_is_an_arm_a_plan_checks
          tests/test_generation.py::test_committed_prepared_files_reserialize_byte_for_byte'
      - name: Verify semantic oracle and mutation witnesses
        run: >-
          docker compose --profile dev run --rm test
          python scripts/benchmark_gate.py --phase suite
          --output-dir /tmp/benchmark
          --source-revision "${{ github.sha }}"
      - name: Check model split labels and mutation adequacy
        run: >-
          docker compose --profile dev run --rm test
          python scripts/probe_adequacy.py
          --output /tmp/adequacy/receipt.json
          --source-revision "${{ github.sha }}"
      - name: Prepare dev prompts from the frozen catalog
        run: >-
          docker compose --profile dev run --rm test
          python scripts/model_run.py prepare
          --catalog /opt/dfilterforge/catalog.sqlite3
          --output-dir /tmp/model-eval/ci-prepare
          --source-revision "${{ github.sha }}"
      - name: Measure retrieval recall on the dev split
        run: >-
          docker compose --profile dev run --rm test
          python scripts/retrieval_recall.py
          --output /tmp/retrieval/recall.json
          --source-revision "${{ github.sha }}"
      - name: Re-score committed model runs offline
        run: |
          docker compose --profile pilot build lab
          checked=0
          for output in docs/results/*/scored \
              docs/results/*/control-reference \
              docs/results/*/control-mutation; do
            [ -d "$output" ] || continue
            run="$(basename "$(dirname "$output")")"
            name="$(basename "$output")"
            control=()
            if [ "$name" != scored ]; then
              control=(--control "${name#control-}")
            fi
            docker compose --profile pilot run --rm lab score \
              --run-dir "/workspace/results/$run" "${control[@]}" \
              --check --code-revision "${{ github.sha }}"
            checked=$((checked + 1))
          done
          echo "re-scored $checked committed output directories"
          test "$checked" -gt 0
      - name: Check committed repair plans and rounds offline
        # While no arm run sits beside its pass, each plan is derived again
        # from the pass and the feedback probe and compared byte for byte.
        # Once arm runs exist, the committed plan is the round's record: it
        # is read and checked against the pass, never derived again, so a
        # gold correction cannot break the check, and each arm's prompts
        # are checked against it. Once every arm run is published and
        # scored the round's summary is derived again too; an arm the gate
        # stopped is read from repair/not_run.json and reported as not run.
        # None is committed before the first repair round, so zero plans is
        # not a failure.
        run: |
          checked=0
          for plan in docs/results/*/repair/plan.json; do
            [ -f "$plan" ] || continue
            run="$(basename "$(dirname "$(dirname "$plan")")")"
            docker compose --profile pilot run --rm lab repair \
              --run-dir "/workspace/results/$run" \
              --check --code-revision "${{ github.sha }}"
            checked=$((checked + 1))
          done
          echo "checked $checked committed repair plans"
      - name: Check committed repair pools offline
        # Each pool is derived again from the committed summaries of the
        # bases it names; zero pools is not a failure.
        run: |
          checked=0
          for pooled in docs/results/repair-pool/*.json; do
            [ -f "$pooled" ] || continue
            docker compose --profile pilot run --rm lab repair-pool \
              --results-dir /workspace/results \
              --split "$(basename "$pooled" .json)" \
              --check --code-revision "${{ github.sha }}"
            checked=$((checked + 1))
          done
          echo "checked $checked committed repair pools"
      - name: Lint the web data scripts
        # Its own step, so the pylint file list above stays as it is.
        run: >-
          docker compose --profile dev run --rm test
          pylint scripts/export_web_data.py scripts/export_web_evidence.py
      - name: Check the committed web evidence
        # Regenerates captures.json in pure Python, compares it byte for
        # byte and matches every capture hash to the test-freeze gate
        # receipt, the scored specifications and the held-out freeze record.
        run: >-
          docker compose --profile dev run --rm
          --volume "$PWD/docs:/workspace/docs:ro"
          test sh -c 'test -d /workspace/docs/results
          && python scripts/export_web_evidence.py check'
      - name: Test the web exporters against the committed tree
        # The suite above skips these files' committed-tree cases, which
        # need docs/: the exporter's values re-derived by an independent
        # resolver and the committed frame tables.
        run: >-
          docker compose --profile dev run --rm
          --volume "$PWD/docs:/workspace/docs:ro"
          test sh -c 'test -d /workspace/docs/results
          && python -m pytest -q -rs -p no:cacheprovider
          tests/test_export_web_data.py tests/test_export_web_evidence.py'
      - name: Export the web data twice and compare
        run: >-
          docker compose --profile dev run --rm
          --volume "$PWD/docs:/workspace/docs:ro"
          test sh -c 'test -d /workspace/docs/results
          && python scripts/export_web_data.py --repo /workspace
          --out /tmp/a --source-commit "${{ github.sha }}"
          && python scripts/export_web_data.py --repo /workspace
          --out /tmp/b --source-commit "${{ github.sha }}"
          && diff -r /tmp/a /tmp/b'

  web:
    name: Web quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and check the site
        uses: ./.github/actions/web-site
      - name: Serve the site image on loopback under the Compose hardening
        # Builds the site stage from the cache the step above filled. On a
        # Linux runner docker-proxy holds the published port from container
        # start, so until node listens a connection is accepted and dropped
        # (curl exit 52 or 56), which --retry-connrefused does not retry;
        # --retry-all-errors does. The trap stops the service on failure too.
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          trap 'docker compose --profile web-local down' EXIT
          docker compose --profile web-local up --build --detach web
          curl --fail --silent --show-error --head \
            --retry 10 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:3000/DFilterForge/

  containers:
    name: Docker contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate all Compose profiles
        run: >-
          docker compose
          --profile pilot
          --profile dev
          --profile web-local
          --profile public-demo
          config

  pages:
    name: Deploy the site to Cloudflare Pages
    # Only a push to main deploys, and only after every gate passed. The job
    # builds the site for the domain root through the same composite action,
    # tests that build, and uploads those bytes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, web, containers]
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare-pages
      url: https://dfilterforge.pages.dev/
    steps:
      - name: Require the Cloudflare secrets
        # Fails in seconds rather than after the build.
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo '::error::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Build and check the site for the domain root
        uses: ./.github/actions/web-site
        with:
          # The runner keeps an explicit empty input; it applies the
          # /DFilterForge default only to an input that is left out.
          base-path: ''
      - name: Refuse a build that kept a base path
        # A /DFilterForge build passes its own tests and 404s every asset
        # at the pages.dev root.
        run: grep -q '="/_next/static/' apps/web/out/index.html
      - name: Give wrangler a directory outside the pnpm workspace
        # wrangler-action installs wrangler with the package manager whose
        # lockfile it finds; at the root that is `pnpm add`, which refuses
        # to add to a workspace root.
        run: mkdir -p "$RUNNER_TEMP/wrangler"
      - uses: actions/setup-node@v4
        with:
          # Wrangler 4 needs Node 22 or later; the action above set up 20.
          node-version: 24
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # v3 defaults to Wrangler 3.90.0.
          wranglerVersion: '4'
          packageManager: npm
          workingDirectory: ${{ runner.temp }}/wrangler
          command: >-
            pages deploy ${{ github.workspace }}/apps/web/out
            --project-name=dfilterforge --branch=main
            --commit-hash=${{ github.sha }}
      - name: Probe the live site at the root
        # Every page links its sources at the commit it was exported from,
        # so the page names this push once the new deployment is live. Then
        # one of its assets must load from the root.
        run: |
          site=https://dfilterforge.pages.dev
          page="$RUNNER_TEMP/methodology.html"
          for attempt in $(seq 12); do
            if curl --fail --silent --show-error --output "$page" \
                "$site/methodology/" \
                && grep -q "/blob/$GITHUB_SHA/" "$page"; then
              break
            fi
            test "$attempt" -lt 12
            sleep 10
          done
          asset="$(grep -o '="/_next/static/[^"]*' "$page" | head -n 1 | cut -c 3-)"
          test -n "$asset"
          curl --fail --silent --show-error --head --output /dev/null \
            "$site$asset"
