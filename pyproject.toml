[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dfilterforge"
version = "0.1.0"
description = "Typed, execution-grounded Wireshark display-filter compiler."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "WeiGuang-2099"}]
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.125,<7",
  "import-linter>=2.1,<3",
  "isort>=5.13,<7",
  "pyink>=24.10,<26",
  "pylint>=3.3,<5",
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
dfilterforge = "dfilterforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dfilterforge"]

[tool.pyink]
line-length = 80
pyink-indentation = 4

[tool.isort]
profile = "google"
line_length = 80
src_paths = ["src", "tests"]

[tool.pyright]
include = [
  "src",
  "tests",
  "scripts/dev_bakeoff.py",
  "scripts/dev_bakeoff_configs.py",
  "scripts/model_run.py",
  "scripts/probe_adequacy.py",
  "scripts/provider_reply_replay.py",
  "scripts/retrieval_recall.py",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
# The test container gives /tmp a 128 MB tmpfs; keeping every passed
# test's tmp_path fills it before the suite ends.
tmp_path_retention_policy = "failed"

[tool.coverage.run]
branch = true
source = ["dfilterforge", "scripts"]
# Ablation and export drivers plus the benchmark gate; their receipts
# are the evidence.
omit = [
  "scripts/benchmark_gate.py",
  "scripts/catalog_ablation.py",
  "scripts/catalog_open_ablation.py",
  "scripts/export_catalog.py",
  "scripts/raw_filter_ablation.py",
  "scripts/runner_ablation.py",
  "scripts/shortcut_ablation.py",
  "scripts/trace_replay_ablation.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pylint.main]
py-version = "3.12"
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 80

[tool.pylint.messages_control]
disable = [
  "too-few-public-methods",
]

[tool.importlinter]
root_packages = ["dfilterforge"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core is independent of interfaces"
type = "forbidden"
source_modules = [
  "dfilterforge.intent_ir",
  "dfilterforge.canonical",
  "dfilterforge.field_catalog",
  "dfilterforge.compiler",
  "dfilterforge.evaluation",
  "dfilterforge.mutants",
  "dfilterforge.score_summary",
  "dfilterforge.score_report",
]
forbidden_modules = [
  "dfilterforge.cli",
  "dfilterforge.catalog_runtime",
  "dfilterforge.benchmark",
  "dfilterforge.runner",
  "dfilterforge.live",
  "dfilterforge.fixtures",
  "dfilterforge.run_store",
  "dfilterforge.scoring",
]

[[tool.importlinter.contracts]]
name = "Nothing in the package imports the network client"
type = "forbidden"
source_modules = ["dfilterforge.*"]
forbidden_modules = ["dfilterforge.model_client"]

[[tool.importlinter.contracts]]
name = "Only the model client reaches the network stack"
type = "forbidden"
source_modules = ["dfilterforge.*"]
forbidden_modules = ["http", "socket", "ssl"]
ignore_imports = [
  "dfilterforge.model_client -> http",
  "dfilterforge.model_client -> ssl",
]

[[tool.importlinter.contracts]]
name = "Prompts and model completions never see gold"
type = "forbidden"
source_modules = [
  "dfilterforge.completions",
  "dfilterforge.field_retrieval",
  "dfilterforge.generation",
  "dfilterforge.held_out",
  "dfilterforge.model_client",
]
forbidden_modules = [
  "dfilterforge.benchmark",
  "dfilterforge.evaluation",
  "dfilterforge.fixtures",
  "dfilterforge.model_cases",
  "dfilterforge.model_dev_cases",
  "dfilterforge.model_feedback",
  "dfilterforge.model_split",
  "dfilterforge.model_test_cases",
]

[[tool.importlinter.contracts]]
name = "Scoring never sees the feedback probe"
type = "forbidden"
source_modules = [
  "dfilterforge.run_store",
  "dfilterforge.scoring",
]
forbidden_modules = ["dfilterforge.model_feedback"]
