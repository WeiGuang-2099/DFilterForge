[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dfilterforge"
version = "0.1.0"
description = "Typed, execution-grounded Wireshark display-filter compiler."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "DFilterForge contributors"}]
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.125,<7",
  "import-linter>=2.1,<3",
  "isort>=5.13,<7",
  "pyink>=24.10,<26",
  "pylint>=3.3,<5",
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
dfilterforge = "dfilterforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dfilterforge"]

[tool.pyink]
line-length = 80
pyink-indentation = 4

[tool.isort]
profile = "google"
line_length = 80
src_paths = ["src", "tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["dfilterforge"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pylint.main]
py-version = "3.12"
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 80

[tool.pylint.messages_control]
disable = [
  "too-few-public-methods",
]

[tool.importlinter]
root_packages = ["dfilterforge"]

[[tool.importlinter.contracts]]
name = "Core is independent of interfaces"
type = "forbidden"
source_modules = [
  "dfilterforge.intent_ir",
  "dfilterforge.canonical",
  "dfilterforge.field_catalog",
  "dfilterforge.compiler",
  "dfilterforge.evaluation",
]
forbidden_modules = [
  "dfilterforge.cli",
  "dfilterforge.catalog_runtime",
  "dfilterforge.benchmark",
  "dfilterforge.runner",
  "dfilterforge.live",
  "dfilterforge.fixtures",
]
