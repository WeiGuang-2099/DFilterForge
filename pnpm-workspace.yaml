packages:
  - apps/*

onlyBuiltDependencies:
  - sharp

# ESLint's two minimatch lines pull brace-expansion releases open to
# GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7 and GHSA-q2hr-2g5m-vwhr; these
# are the first releases of each line that fix all three.
# eslint-plugin-react-hooks pulls zod, open to GHSA-mrhx-c7xc-m3w5 below
# 4.6.6, the first release that fixes it.
overrides:
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'zod@<4.6.6': 4.6.6
